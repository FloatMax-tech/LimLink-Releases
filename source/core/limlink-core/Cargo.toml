[package]
name = "limlink-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "LimLink shared core: CPace invite, key confirmation, ticket, SAS and file-hash format"

[features]
default = ["c-api"]
# Frozen C ABI (llc_*). The testvectors crate turns this off so its
# staticlib/cdylib does not re-export production symbols.
c-api = []
# Fixed RNG script. Refused in release (see build.rs and lib.rs).
test-rng = []

[lib]
name = "limlink_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
pakery-cpace = "=0.6.0"
pakery-crypto = { version = "=0.6.0", default-features = false, features = ["std", "ristretto255"] }
rand_core = "0.10"
sha2 = "0.11"
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
pakery-core = "=0.6.0"
serde_json = "1"
